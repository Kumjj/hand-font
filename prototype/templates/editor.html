<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노트 편집 - Hand Font</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">Hand Font</a>
        <nav class="nav-links">
            <span class="user-badge">{{ user.username }}</span>
            <a href="/notes">내 노트</a>
            <button type="button" id="logout-btn" class="btn btn-secondary">로그아웃</button>
        </nav>
    </header>

    <main class="container" data-page="editor" data-note-id="{{ note_id }}">
        <section class="card">
            <div class="editor-header">
                <h1>초경량 노트 편집기</h1>
                <a href="/notes" class="btn btn-secondary">목록으로</a>
            </div>

            <div class="inline-form">
                <input type="text" id="editor-title" placeholder="노트 제목">
                <input type="text" id="editor-subject" placeholder="과목">
                <button type="button" id="save-note-btn" class="btn btn-primary">노트 저장</button>
            </div>

            <div class="toolbar">
                <button type="button" id="add-text-btn" class="btn btn-secondary">+ 텍스트 블록</button>
                <button type="button" id="add-math-btn" class="btn btn-secondary">+ 수식 블록</button>
                <button type="button" id="insert-sample-btn" class="btn btn-secondary">예시 블록 채우기</button>
                <button type="button" id="ai-placeholder-btn" class="btn btn-secondary">AI 필기 분석 (준비 중)</button>
            </div>
            <p id="editor-message" class="message"></p>
        </section>

        <section class="editor-workspace">
            <div class="card canvas-card">
                <h2>페이지 캔버스 (블록 드래그 이동)</h2>
                <div id="page-canvas" class="page-canvas"></div>
            </div>

            <div class="card inspector-card">
                <h2>선택된 블록 편집</h2>
                <div id="block-inspector-empty" class="item-meta">캔버스에서 블록을 클릭하면 여기서 수정할 수 있습니다.</div>
                <div id="block-inspector" class="form-stack hidden">
                    <label>
                        블록 유형
                        <select id="prop-type">
                            <option value="text">text (텍스트)</option>
                            <option value="math">math (수식)</option>
                            <option value="image">image (그림/필기)</option>
                        </select>
                    </label>
                    <label>
                        내용
                        <textarea id="prop-content" rows="3"></textarea>
                    </label>
                    <div class="grid-2">
                        <label>X (0~1) <input type="number" id="prop-x" step="0.01" min="0" max="1"></label>
                        <label>Y (0~1) <input type="number" id="prop-y" step="0.01" min="0" max="1"></label>
                        <label>너비 (0~1) <input type="number" id="prop-width" step="0.01" min="0.05" max="1"></label>
                        <label>높이 (0~1) <input type="number" id="prop-height" step="0.01" min="0.04" max="1"></label>
                    </div>
                    <label>레이어 (zIndex) <input type="number" id="prop-z" step="1" min="1"></label>
                    <button type="button" id="delete-block-btn" class="btn btn-danger">선택 블록 삭제</button>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>사용자 정의 템플릿</h2>
            <div class="inline-form">
                <input type="text" id="template-name-input" placeholder="저장할 템플릿 이름">
                <button type="button" id="save-template-btn" class="btn btn-primary">현재 블록을 템플릿으로 저장</button>
            </div>
            <div class="inline-form template-load-row">
                <select id="template-select">
                    <option value="">불러올 템플릿 선택</option>
                </select>
                <button type="button" id="load-template-btn" class="btn btn-secondary">템플릿 불러오기</button>
            </div>
        </section>

        <section class="card">
            <div class="editor-header">
                <h2>블록 JSON 데이터</h2>
                <button type="button" id="apply-json-btn" class="btn btn-secondary">JSON 반영하기</button>
            </div>
            <textarea id="editor-json" rows="12" class="full-width"></textarea>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
