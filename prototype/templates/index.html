<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HANd FONt</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">HANd FONt</a>
        <nav class="nav-links">
            {% if user %}
                <span class="user-badge">{{ user.username }}</span>
                <a href="/notes">내 노트</a>
                <button type="button" id="logout-btn" class="btn btn-secondary">로그아웃</button>
            {% else %}
                <a href="/login">로그인</a>
                <a href="/register" class="btn btn-primary">시작하기</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        <section class="card hero-banner">
            <h1>HANd FONt</h1>
            <div class="actions">
                {% if user %}
                    <a href="/notes" class="btn btn-primary">내 노트 열기</a>
                {% else %}
                    <a href="/register" class="btn btn-primary">시작하기</a>
                    <a href="/login" class="btn btn-secondary">로그인</a>
                {% endif %}
            </div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
