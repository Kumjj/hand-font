<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HanD Font</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">HanD Font</a>
        <nav class="nav-links">
            <a href="/" class="nav-item active">홈</a>
            {% if user %}
                <a href="/notes" class="nav-item">내 노트</a>
                <span class="user-badge">{{ user.username }}</span>
                <button type="button" id="logout-btn" class="btn btn-secondary">로그아웃</button>
            {% else %}
                <a href="/login" class="nav-item">로그인</a>
                <a href="/register" class="btn btn-primary">시작하기</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        <section class="card hero-split">
            <div class="hero-left">
                <h1 class="hero-title">HanD Font</h1>
                <p class="hero-sub">손글씨 필기를 블록형 디지털 노트로 정리하고 저장하는 웹 노트</p>
                <div class="actions">
                    {% if user %}
                        <a href="/notes" class="btn btn-primary">내 노트 열기</a>
                    {% else %}
                        <a href="/register" class="btn btn-primary">시작하기</a>
                        <a href="/login" class="btn btn-secondary">로그인</a>
                    {% endif %}
                </div>
            </div>
            <div class="hero-preview-paper">
                <div class="paper-header">
                    <span class="paper-doc-title">미적분과 방정식</span>
                    <span class="paper-tag">수학</span>
                </div>
                <div class="paper-block text-sample" style="left: 7%; top: 18%; width: 54%;">01. 이차방정식의 근의 공식</div>
                <div class="paper-block math-sample" id="hero-katex-1" style="left: 7%; top: 32%; width: 56%;"></div>
                <div class="paper-block text-sample" style="left: 7%; top: 53%; width: 50%;">02. 정적분의 기본 정리</div>
                <div class="paper-block math-sample" id="hero-katex-2" style="left: 7%; top: 67%; width: 54%;"></div>
                <div class="paper-block graph-sample" style="left: 66%; top: 22%; width: 27%; height: 48%;">
                    <svg viewBox="0 0 100 110" width="100%" height="100%">
                        <line x1="10" y1="90" x2="92" y2="90" stroke="#94a3b8" stroke-width="2"/>
                        <line x1="50" y1="10" x2="50" y2="98" stroke="#94a3b8" stroke-width="2"/>
                        <path d="M 18 22 Q 50 130 82 22" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="paper-footer">y = x² · Block Note</div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script>
        if (window.katex) {
            window.katex.render("x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}", document.getElementById("hero-katex-1"), { throwOnError: false });
            window.katex.render("\\int_0^1 x^2 \\, dx = \\frac{1}{3}", document.getElementById("hero-katex-2"), { throwOnError: false });
        }
    </script>
    <script src="/static/script.js"></script>
</body>
</html>
